<!DOCTYPE html>
<html>
  <head>
    <title>
      Grid Practice
    </title>
  </head>

  <body>
    <div style="
      display: grid;
      grid-template-columns: 100px 100px;
      ">
      <div style="
      background-color: lightseagreen;
      "
      >div 1</div>
      <div style="
      background-color: lightsalmon;
      ">div 2 <p>text</p></div>
        
    </div>

     <div style="
      display: grid;
      grid-template-columns: 100px 100px 200px;
      margin-top: 30px;
      ">
      <div style="
      background-color: lightseagreen;
      "
      >100px</div>
      <div style="
      background-color: lightsalmon;
      ">100px <p>text</p></div>

      <div style="
      background-color: lightseagreen;
    
      ">200px</div>

      <div style="
      background-color: lightsalmon;
      "
      >100px</div>
        
    </div>

    <div style="
      display: grid;
      grid-template-columns: 100px 1fr;
      margin-top: 30px;">


        <div style="
        background-color: lightseagreen;
        ">100px</div>

        <div style="background-color: lightsalmon;" >1fr</div>
      </div>


      <div style="
      display: grid;
      grid-template-columns: 100px 1fr 1fr;
      margin-top: 30px;">
      <div style="background-color: lightseagreen;">100px</div>
      
      <div style="background-color: lightsalmon;">1fr</div>

      <div style="background-color: lightseagreen;">1fr</div>
     </div>


     <div style="
     display: grid;
     grid-template-columns: 1fr 1fr 1fr;
     margin-top: 50px;
     margin-bottom: 300px;
     height: 300px;
     column-gap: 20px;
     row-gap: 40px;">
      <div style="background-color: lightseagreen; ">1fr</div>

      <div style="background-color: lightsalmon;" >1fr</div>

      <div style="background-color: lightseagreen;">1fr</div>

      <div style="background-color: lightsalmon;" >1fr</div>

      <div style="background-color: lightseagreen;">1fr</div>

      <div style="background-color: lightsalmon; ">1fr</div>


     </div>
  </body>
</html>
